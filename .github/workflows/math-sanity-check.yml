name: Math Sanity Check

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  math-sanity-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run math sanity checks
        run: node scripts/math-sanity-check.js
