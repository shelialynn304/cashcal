name: Site Audit

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  site-audit:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js (LTS)
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: Run static site audit
        run: node scripts/site-audit.js
