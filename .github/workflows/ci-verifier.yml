name: CI Verifier

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  ci-verifier:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Verify CI wiring
        run: python scripts/ci-verifier.py
